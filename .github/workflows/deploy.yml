name: deploy

on:
  workflow_call:
    inputs:
      tag:
        description: 'image tag (e.g. latest, 1.2.3, sha-<commit>)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag (e.g. latest, 1.2.3, sha-<commit>)'
        type: string
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: production
    env:
      SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      IMAGE: snikimonk/quizon:${{ inputs.tag }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - name: set up ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: deploy
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
        run: |
          {
            printf 'export IMAGE=%q PG_DSN=%q DOMAIN=%q\n' "$IMAGE" "$PG_DSN" "$DOMAIN"
            cat <<'SCRIPT'
          set -euo pipefail

          docker pull "$IMAGE"
          # stop шлёт SIGTERM и даёт приложению доработать начатые запросы, rm -f убил бы его сразу
          docker stop quizon 2>/dev/null || true
          docker rm -f quizon 2>/dev/null || true
          docker run -d \
            --name quizon \
            --restart unless-stopped \
            --network host \
            -e PG_DSN \
            -e DOMAIN \
            "$IMAGE"
          docker image prune -f
          SCRIPT
          } | ssh "$SSH_TARGET" bash -s

      # новый контейнер должен ответить через Caddy, иначе деплой красный
      - name: check the site
        run: >-
          curl -fsS -o /dev/null --max-time 5
          --retry 15 --retry-delay 2 --retry-all-errors
          "https://$DOMAIN/"

      - name: container logs
        if: failure()
        run: ssh "$SSH_TARGET" docker logs --tail 100 quizon
