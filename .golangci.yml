version: "2"
run:
  concurrency: 8
  issues-exit-code: 1
  tests: true
linters:
  default: all
  disable:
    - containedctx
    - depguard
    - dupl
    - err113
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - godot
    - ireturn
    - mnd
    - nilerr
    - nlreturn
    - nolintlint
    - perfsprint
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    revive:
      rules:
        - name: var-naming
          arguments:
            - - ID
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: exported func .* returns unexported type .*, which can be annoying to use
      - path: (.+)\.go$
        text: should omit type .* from declaration of var .*; it will be inferred from the right-hand side
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
